<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050709"><title>AERON GT Mobile</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050709;color:#fff;font-family:Arial,sans-serif}body{height:260vh}.hero{position:fixed;inset:0;overflow:hidden;background:#050709}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 72%;transform:scale(1.16);filter:brightness(.96) contrast(1.04);will-change:transform}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.08) 48%,rgba(0,0,0,.72));pointer-events:none}.brand{position:fixed;z-index:3;top:calc(22px + env(safe-area-inset-top));left:24px;font-size:22px;font-weight:800;letter-spacing:.25em;text-shadow:0 2px 18px #000}.brand b{color:#d7ff45}.hud{position:fixed;z-index:3;right:24px;top:130px;text-align:right;font-size:10px;letter-spacing:.18em;text-shadow:0 2px 18px #000}.hud b{display:block;color:#d7ff45;font-size:28px;margin-top:6px}.copy{position:fixed;z-index:3;left:24px;right:24px;bottom:calc(42px + env(safe-area-inset-bottom));text-shadow:0 2px 20px #000}.ey{font-size:10px;letter-spacing:.22em;color:#d7ff45}h1{margin:12px 0 10px;font-size:18vw;line-height:.8;letter-spacing:-.06em}p{font-size:15px;line-height:1.45;max-width:32ch;margin:0}</style></head><body><div class="hero"><img id="car" src="https://raw.githack.com/macmacintoshse/markdownlint/aeron-photoreal-assets/aeron-assets/test.jpg" alt="AERON GT"><div class="shade"></div></div><div class="brand">AERON <b>GT</b></div><div class="hud">SCROLL / ZOOM<b id="pct">0%</b></div><div class="copy"><div class="ey">MOBILE / HERO</div><h1>AERON<br>GT</h1><p>Mobilny kadr ustawiony niżej, tak aby samochód był centralnie widoczny od pierwszego ekranu.</p></div><script>const c=document.getElementById('car'),p=document.getElementById('pct');function u(){const m=Math.max(1,document.documentElement.scrollHeight-innerHeight),v=Math.min(1,scrollY/m);c.style.transform=`translate3d(${(v*8-4).toFixed(1)}px,${(-v*8).toFixed(1)}px,0) scale(${(1.16+v*.16).toFixed(3)})`;p.textContent=Math.round(v*100)+'%'}addEventListener('scroll',u,{passive:true});u();</script></body></html>
